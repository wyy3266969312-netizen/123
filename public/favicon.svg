<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Hazel 达人营销">
  <!-- Two rings actually linked, not merely overlapped: the dark ring passes
       over the warm one at the lower crossing and under it at the upper one,
       with a hairline of the panel colour left as clearance. Plain overlap is
       what makes a two-circle mark read as Audi; the over-under is what makes
       it read as joined.

       The pair is deliberately unequal — different radii, different stroke
       weights, set on a diagonal — so it fills a square frame and keeps some
       movement. Warm palette: the brand is called Hazel, which is a colour. -->
  <style>
    .panel { fill: #faf7f3; }
    .ink   { stroke: #1f1b18; }
    .warm  { stroke: #c1844f; }
    .gap   { stroke: #faf7f3; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #181614; }
      .ink   { stroke: #f4f1ed; }
      .warm  { stroke: #d69e69; }
      .gap   { stroke: #181614; }
    }
  </style>
  <rect class="panel" width="100" height="100" rx="25"/>
  <g fill="none">
    <circle class="ink"  cx="39.07" cy="58.23" r="22.67" stroke-width="10.8"/>
    <circle class="warm" cx="69.3" cy="33.4" r="15.65" stroke-width="8.1"/>
    <path class="gap" d="M 48.15 37.46 A 22.67 22.67 0 0 1 61.21 53.36" stroke-width="15.80"/>
    <path class="ink" d="M 48.15 37.46 A 22.67 22.67 0 0 1 61.21 53.36" stroke-width="10.8"/>
  </g>
</svg>
